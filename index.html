<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>发型水印</title>
<meta name="theme-color" content="#1c1917">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="发型水印">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --bg: #faf7f2;
    --card: #ffffff;
    --ink: #1c1917;
    --muted: #78716c;
    --line: #e7e2da;
    --accent: #b45309;
    --accent-ink: #ffffff;
    --wechat: #07c160;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141210;
      --card: #1f1c19;
      --ink: #f5f1ea;
      --muted: #a8a29e;
      --line: #35302b;
      --accent: #f59e0b;
      --accent-ink: #1c1917;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
                 "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    max-width: 560px; margin: 0 auto;
  }
  h1 { font-size: 22px; margin: 8px 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 20px; }

  .step { font-size: 13px; color: var(--muted); margin: 18px 0 8px; font-weight: 600; letter-spacing: .02em; }

  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .mode {
    border: 2px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 16px; padding: 14px 12px; text-align: left; font: inherit; cursor: pointer;
  }
  .mode b { display: block; font-size: 17px; margin-bottom: 4px; }
  .mode span { font-size: 12px; color: var(--muted); line-height: 1.4; }
  .mode[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
  .mode.wechat[aria-pressed="true"] { border-color: var(--wechat); box-shadow: 0 0 0 3px color-mix(in srgb, var(--wechat) 20%, transparent); }

  .big {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; min-height: 60px; border: 0; border-radius: 16px;
    background: var(--accent); color: var(--accent-ink);
    font: inherit; font-size: 19px; font-weight: 700; cursor: pointer;
  }
  .big.secondary { background: var(--ink); color: var(--bg); }
  .big:disabled { opacity: .5; }
  input[type=file] { display: none; }

  .status { text-align: center; color: var(--muted); font-size: 14px; min-height: 20px; margin: 12px 0; }

  .results { display: grid; gap: 14px; }
  .result { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .result img { display: block; width: 100%; height: auto; }
  .result .row { display: flex; gap: 8px; padding: 10px; }
  .result .row button {
    flex: 1; min-height: 44px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); font: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .hint { font-size: 13px; color: var(--muted); text-align: center; margin: 10px 0 0; line-height: 1.5; }
  #saveAllWrap { display: none; margin-top: 12px; }
  .warn { display: none; background: #dc2626; color: #fff; border-radius: 12px; padding: 10px 12px; font-size: 14px; margin-bottom: 12px; line-height: 1.5; }
</style>
</head>
<body>

<div class="warn" id="warn">⚠️ 预约链接还没设置（config.js 里还是占位链接），二维码现在扫出来是错的，先别发出去。</div>
<div class="warn" id="wechatWarn">↗ 现在是在微信里打开的，照片存不了。<br>请点右上角 <b>「···」</b>，再点 <b>「在 Safari 中打开」</b>。</div>
<h1>✂ 发型水印</h1>
<p class="sub">选照片 → 自动加水印 → 保存到相册</p>

<div class="step">① 发到哪里？</div>
<div class="modes">
  <button class="mode" id="modeNormal" aria-pressed="true">
    <b>普通版</b>
    <span>Instagram · Facebook<br>TikTok · 小红书</span>
  </button>
  <button class="mode wechat" id="modeWechat" aria-pressed="false">
    <b>微信版</b>
    <span>带二维码<br>朋友圈长按就能预约</span>
  </button>
</div>

<div class="step">② 选照片（可以一次选多张）</div>
<label class="big" for="file">📷 选照片</label>
<input id="file" type="file" accept="image/*" multiple>

<div class="status" id="status"></div>

<div id="saveAllWrap">
  <button class="big secondary" id="saveAll">⬇ 全部保存</button>
  <p class="hint">也可以<b>长按图片</b> →「存储到照片」</p>
</div>

<div class="results" id="results" style="margin-top:14px"></div>

<script src="vendor/qrcode.min.js"></script>
<script src="config.js"></script>
<script>
(function () {
  const C = window.BARBER_CONFIG;
  const MAX_EDGE = 2160;           // 输出最长边（Instagram 等平台会再压到 1080）
  const JPEG_QUALITY = 0.9;
  if (/your-name/.test(C.bookingUrl)) document.getElementById('warn').style.display = 'block';
  if (/MicroMessenger/i.test(navigator.userAgent)) document.getElementById('wechatWarn').style.display = 'block';
  const FONT = '-apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif';

  // ---------- 模式（记住上次的选择） ----------
  let mode = 'normal';
  try { mode = localStorage.getItem('wm-mode') || 'normal'; } catch (e) {}
  const btnN = document.getElementById('modeNormal');
  const btnW = document.getElementById('modeWechat');
  function setMode(m) {
    mode = m;
    btnN.setAttribute('aria-pressed', m === 'normal');
    btnW.setAttribute('aria-pressed', m === 'wechat');
    try { localStorage.setItem('wm-mode', m); } catch (e) {}
  }
  btnN.onclick = () => setMode('normal');
  btnW.onclick = () => setMode('wechat');
  setMode(mode);

  // ---------- 资源 ----------
  function loadImage(src) {
    return new Promise((res, rej) => {
      const img = new Image();
      img.onload = () => res(img);
      img.onerror = rej;
      img.src = src;
    });
  }
  let logoImg = null;
  const logoReady = C.logo ? loadImage(C.logo).then(i => (logoImg = i)).catch(() => null) : Promise.resolve();

  const qr = qrcode(0, 'H');       // 最高容错：被压缩、略被遮挡也能扫
  qr.addData(C.bookingUrl);
  qr.make();

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // ---------- 普通版：右下角半透明标签 ----------
  function drawNormal(ctx, W, H) {
    const u = Math.min(W, H) / 100;
    const f1 = Math.round(4 * u), f2 = Math.round(2.6 * u);
    const pad = Math.round(2 * u), gap = Math.round(0.8 * u), margin = Math.round(3 * u);

    ctx.font = `700 ${f1}px ${FONT}`;
    const nameW = ctx.measureText(C.shopName).width;
    ctx.font = `500 ${f2}px ${FONT}`;
    const capW = ctx.measureText(C.normalCaption).width;

    const iconSize = Math.round(f1 * (logoImg ? 2.1 : 1.15));
    const iconGap = Math.round(1.4 * u);
    const textW = Math.max(nameW, capW);
    const boxW = Math.round(pad * 2 + iconSize + iconGap + textW);
    const boxH = Math.round(pad * 2 + f1 + gap + f2);
    const x = W - margin - boxW, y = H - margin - boxH;

    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    roundRect(ctx, x, y, boxW, boxH, Math.round(1.8 * u));
    ctx.fill();

    const iconX = x + pad, midY = y + boxH / 2;
    if (logoImg) {
      const s = Math.min(iconSize, boxH - pad);
      const ratio = logoImg.width / logoImg.height;
      const lw = ratio >= 1 ? s : s * ratio, lh = ratio >= 1 ? s / ratio : s;
      ctx.drawImage(logoImg, iconX + (iconSize - lw) / 2, midY - lh / 2, lw, lh);
    } else {
      ctx.fillStyle = '#fff';
      ctx.font = `700 ${iconSize}px ${FONT}`;
      ctx.textBaseline = 'middle';
      ctx.fillText('✂︎', iconX, midY);
    }

    const tx = iconX + iconSize + iconGap;
    ctx.textBaseline = 'top';
    ctx.fillStyle = '#fff';
    ctx.font = `700 ${f1}px ${FONT}`;
    ctx.fillText(C.shopName, tx, y + pad);
    ctx.fillStyle = 'rgba(255,255,255,0.88)';
    ctx.font = `500 ${f2}px ${FONT}`;
    ctx.fillText(C.normalCaption, tx, y + pad + f1 + gap);
  }

  // ---------- 微信版：右下角白色二维码卡片 ----------
  function drawWechat(ctx, W, H) {
    const S = Math.min(W, H), u = S / 100;
    const n = qr.getModuleCount();
    // 二维码约占短边 22%，且至少 240px，保证压缩后还能识别
    const target = Math.min(S * 0.32, Math.max(S * 0.22, 240));
    const cell = Math.max(3, Math.floor(target / n));
    const qrSize = cell * n;
    const quiet = cell * 3;              // 二维码四周留白
    const f1 = Math.round(Math.max(qrSize * 0.12, 16));
    const f2 = Math.round(Math.max(qrSize * 0.085, 13));
    const gap = Math.round(f2 * 0.45);
    const margin = Math.round(3 * u);

    ctx.font = `700 ${f1}px ${FONT}`;
    const nameW = ctx.measureText('✂︎ ' + C.shopName).width;
    ctx.font = `600 ${f2}px ${FONT}`;
    const capW = ctx.measureText(C.wechatCaption).width;

    const boxW = Math.round(Math.max(qrSize + quiet * 2, nameW + quiet * 2, capW + quiet * 2));
    const boxH = Math.round(quiet + qrSize + gap * 2 + f1 + gap + f2 + quiet);
    const x = W - margin - boxW, y = H - margin - boxH;

    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.25)';
    ctx.shadowBlur = Math.round(2 * u);
    ctx.fillStyle = '#ffffff';
    roundRect(ctx, x, y, boxW, boxH, Math.round(2 * u));
    ctx.fill();
    ctx.restore();

    const qx = Math.round(x + (boxW - qrSize) / 2), qy = Math.round(y + quiet);
    ctx.fillStyle = '#111111';
    for (let r = 0; r < n; r++)
      for (let c = 0; c < n; c++)
        if (qr.isDark(r, c)) ctx.fillRect(qx + c * cell, qy + r * cell, cell, cell);

    const cx = x + boxW / 2;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillStyle = '#111111';
    ctx.font = `700 ${f1}px ${FONT}`;
    ctx.fillText('✂︎ ' + C.shopName, cx, qy + qrSize + gap * 2);
    ctx.fillStyle = '#07a352';
    ctx.font = `600 ${f2}px ${FONT}`;
    ctx.fillText(C.wechatCaption, cx, qy + qrSize + gap * 2 + f1 + gap);
    ctx.textAlign = 'left';
  }

  // ---------- 处理一张照片 ----------
  async function processFile(file) {
    const url = URL.createObjectURL(file);
    try {
      const img = await loadImage(url);   // 现代浏览器会按 EXIF 自动转正
      const scale = Math.min(1, MAX_EDGE / Math.max(img.naturalWidth, img.naturalHeight));
      const W = Math.round(img.naturalWidth * scale), H = Math.round(img.naturalHeight * scale);
      const canvas = document.createElement('canvas');
      canvas.width = W; canvas.height = H;
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, 0, 0, W, H);
      if (mode === 'wechat') drawWechat(ctx, W, H); else drawNormal(ctx, W, H);
      const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', JPEG_QUALITY));
      return blob;
    } finally {
      URL.revokeObjectURL(url);
    }
  }

  // ---------- 保存 / 分享 ----------
  const stamp = () => {
    const d = new Date(), p = v => String(v).padStart(2, '0');
    return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
  };
  function download(file) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(file);
    a.download = file.name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }
  async function save(files) {
    if (navigator.canShare && navigator.canShare({ files })) {
      try { await navigator.share({ files }); return; }
      catch (e) { if (e.name === 'AbortError') return; }
    }
    files.forEach((f, i) => setTimeout(() => download(f), i * 300));
  }

  // ---------- 主流程 ----------
  const input = document.getElementById('file');
  const status = document.getElementById('status');
  const results = document.getElementById('results');
  const saveAllWrap = document.getElementById('saveAllWrap');
  let outFiles = [];

  input.onchange = async () => {
    const files = Array.from(input.files || []);
    input.value = '';
    if (!files.length) return;
    await logoReady;
    results.innerHTML = '';
    outFiles = [];
    saveAllWrap.style.display = 'none';
    const tag = stamp();
    for (let i = 0; i < files.length; i++) {
      status.textContent = `正在处理 ${i + 1} / ${files.length} …`;
      try {
        const blob = await processFile(files[i]);
        const file = new File([blob], `${C.shopName}-${tag}-${i + 1}.jpg`, { type: 'image/jpeg' });
        outFiles.push(file);
        const card = document.createElement('div');
        card.className = 'result';
        const im = document.createElement('img');
        im.src = URL.createObjectURL(blob);
        im.alt = '加好水印的照片';
        const row = document.createElement('div');
        row.className = 'row';
        const b = document.createElement('button');
        b.textContent = '⬇ 保存这张';
        b.onclick = () => save([file]);
        row.appendChild(b);
        card.append(im, row);
        results.appendChild(card);
      } catch (e) {
        console.error(e);
        status.textContent = `第 ${i + 1} 张处理失败，换一张试试`;
      }
    }
    if (outFiles.length) {
      status.textContent = `✅ 好了！共 ${outFiles.length} 张`;
      saveAllWrap.style.display = 'block';
      document.getElementById('saveAll').textContent =
        outFiles.length > 1 ? `⬇ 全部保存（${outFiles.length} 张）` : '⬇ 保存';
    }
  };
  document.getElementById('saveAll').onclick = () => save(outFiles);
})();
</script>
</body>
</html>
